[package]
name = "smart-term"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.29"
egui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
portable-pty = "0.8.1"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1.8", features = ["v4"] }
vt100 = "0.16.2"
anyhow = "1.0"
tokio = { version = "1.53.1", features = ["full"] }
axum = "0.8.9"
window-vibrancy = "0.8.0"
raw-window-handle = "0.6"
sysinfo = "0.39.6"
dark-light = "2.0.0"
walkdir = "2.5.0"
vte = "0.15.0"
tempfile = "3.27.0"
egui_sgr = "0.3.0"
libc = "0.2.189"
rfd = "0.17.2"
regex = "1.10"
base64 = "0.22"
